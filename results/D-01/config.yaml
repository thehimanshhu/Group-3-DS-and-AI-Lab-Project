# D-01: the default config on the full train split ("XLS-R default" in notebook 3, Section 5).
# Same settings as configs/default.yaml.
run_id: D-01
seed: 42

experiment:
  owner: Tarika
  param: null
  value: null

data:
  manifest: manifests/manifest_m4.csv
  sample_rate: 16000
  crop_seconds: 4.0
  tune_subset: false

model:
  name: facebook/wav2vec2-xls-r-300m
  freeze_feature_encoder: true
  freeze_transformer_layers: 0
  pooling: mean
  dropout: 0.1

train:
  epochs: 5
  batch_size: 8
  grad_accum_steps: 1
  lr_encoder: 1.0e-5
  lr_head: 1.0e-3
  weight_decay: 0.01
  scheduler: cosine
  warmup_ratio: 0.1
  grad_clip_norm: 1.0
  fp16: true
  class_weights: from_train
  early_stopping_patience: 2

augment:
  speed: {enabled: false}
  pitch: {enabled: false}
  shift: {enabled: false}
  reverb: {enabled: false}
  rawboost: {enabled: false}
  noise: {enabled: false}
  gain: {enabled: false}
  channel: {enabled: false}
