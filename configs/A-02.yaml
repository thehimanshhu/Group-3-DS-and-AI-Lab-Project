# A-02: AASIST-L baseline (Table C), trained from scratch on the full train split.
# raw waveform + graph attention (Jung et al., 2022). lr and weight decay from the AASIST recipe; fp16 off
# because its temperature-100 softmax overflows in half precision.
# Same data, splits, crops, class weights and early stopping on valid EER as the XLS-R runs.
run_id: A-02
seed: 42

experiment:
  owner: Amit
  param: model.name
  value: aasist_l

data:
  manifest: manifests/manifest_m4.csv
  sample_rate: 16000
  crop_seconds: 4.0
  tune_subset: false

model:
  name: aasist_l               # src/model.py builds the baseline; the XLS-R settings don't apply

train:
  epochs: 10
  batch_size: 24
  grad_accum_steps: 1
  lr_encoder: 0.0              # no pretrained encoder
  lr_head: 1.0e-4                # the learning rate of every weight
  weight_decay: 0.0001
  scheduler: cosine
  warmup_ratio: 0.05
  grad_clip_norm: 1.0
  fp16: false
  class_weights: from_train
  early_stopping_patience: 3
  num_workers: 4

augment:
  speed: {enabled: false}
  pitch: {enabled: false}
  shift: {enabled: false}
  reverb: {enabled: false}
  rawboost: {enabled: false}
  noise: {enabled: false}
  gain: {enabled: false}
  channel: {enabled: false}
